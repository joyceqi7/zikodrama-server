name: drama-integration

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: drama_local_test
    ports:
      - "127.0.0.1:33306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdrama_local_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:36379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
