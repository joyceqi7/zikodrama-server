# ZikoDrama 网关：替代客户原有的 drama-nginx 工程。
#   api.zikodrama-tv.com   → Mini 消费者接口 /api/ 与 BytePlus 回调 /callbacks/（本机 18080）
#   admin.zikodrama-tv.com → 后台静态页（本机 5175）+ 同源 /admin/ 接口（本机 18080）
#   zikodrama-tv.com       → 公开的隐私政策 /privacy 与服务条款 /terms（静态页，TikTok 开发者后台登记用）
# vod.zikodrama-tv.com、img.zikodrama-tv.com 直接 CNAME 到 BytePlus CDN，不经过这里。
# 证书：Let's Encrypt 签发的 api + admin 双域名证书，由 renew-certs.sh 每天检查续期。
#
# ZikoShorts 是同机第二套独立实例（独立库、独立 BytePlus 账号），只共用这台网关：
#   api.zikoshorts.com   → 本机 18081
#   admin.zikoshorts.com → 后台静态页（本机 5176）+ 同源 /admin/（本机 18081）
#   zikoshorts.com       → ZikoShorts 法律文本页与 logo
# 证书 zikoshorts.com 覆盖以上四个域名，同样由 renew-certs.sh 续期。

# Mini 运行在 TikTok 的宿主域名下，跨域调用 API；只放行这些来源和本机调试。
map $http_origin $drama_cors_origin {
    default "";
    ~^https://([a-z0-9-]+\.)*tiktok-minis\.(us|eu|com)$ $http_origin;
    ~^https://([a-z0-9-]+\.)*tiktokminis\.us$ $http_origin;
    ~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$ $http_origin;
}

server {
    listen 80;
    server_name api.zikodrama-tv.com admin.zikodrama-tv.com zikodrama-tv.com www.zikodrama-tv.com
                api.zikoshorts.com admin.zikoshorts.com zikoshorts.com www.zikoshorts.com;

    # 申请或续期证书时使用的 HTTP 校验目录。
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.zikodrama-tv.com;

    ssl_certificate     /etc/letsencrypt/live/api.zikodrama-tv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zikodrama-tv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 11m;

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $drama_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Mini-Version, X-Mini-Contract, X-Request-ID" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary Origin always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $drama_cors_origin always;
        add_header Access-Control-Expose-Headers "X-Request-ID" always;
        add_header Vary Origin always;

        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # BytePlus VOD 上传/转码回调，服务端自行验签。
    location /callbacks/ {
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.zikodrama-tv.com;

    ssl_certificate     /etc/letsencrypt/live/api.zikodrama-tv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zikodrama-tv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 封面上传约 10 MiB 加 multipart 开销；视频由浏览器直传 BytePlus，不经过这里。
    client_max_body_size 11m;

    location /admin/ {
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        proxy_pass http://127.0.0.1:5175;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}

# 主域名只提供法律文本静态页；www 跳转到主域名。
server {
    listen 443 ssl;
    http2 on;
    server_name zikodrama-tv.com www.zikodrama-tv.com;

    ssl_certificate     /etc/letsencrypt/live/zikodrama-tv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zikodrama-tv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.zikodrama-tv.com) {
        return 301 https://zikodrama-tv.com$request_uri;
    }

    root /usr/share/nginx/legal;
    add_header X-Content-Type-Options "nosniff" always;

    location = /privacy { try_files /privacy/index.html =404; }
    location = /terms { try_files /terms/index.html =404; }
    location / { try_files $uri $uri/index.html =404; }
}

