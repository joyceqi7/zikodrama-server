# ZikoDrama 的基础设施：MySQL、Redis、网关。
# 业务容器（drama-server、drama-admin）由各自仓库的 deploy.sh 发布，不在这里。
# 用法：cp .env.example .env && 填密码 && docker compose up -d
name: tkdrama-infra

services:
  mysql:
    image: mysql:8.4
    container_name: tkdrama-mysql
    restart: always
    # 只监听本机；drama-server 生产容器使用 host 网络，经 127.0.0.1 访问。
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tk_drama
      MYSQL_USER: drama
      MYSQL_PASSWORD: ${MYSQL_DRAMA_PASSWORD:?请在 .env 设置 MYSQL_DRAMA_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max-connections=500
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化 SQL 只读挂载，供手动 SOURCE 执行；容器不会自动导入。
      - ../../sql:/drama-sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: tkdrama-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    # UID 发号进度保存在 Redis：必须持久化，且不能淘汰键。
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data

  gateway:
    image: nginx:1.29-alpine
    container_name: tkdrama-gateway
    restart: always
    # host 网络：直接占用 80/443，并回源到本机 18080（API）和 5175（后台静态页）。
    network_mode: host
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/proxy_params.inc:/etc/nginx/conf.d/proxy_params.inc:ro
      - ./certs:/etc/nginx/certs:ro
      - ./acme:/var/www/acme:ro

volumes:
  mysql-data:
  redis-data:
