app:
  name: kratos-demo
  version: v1.0.0
  env: development

otel:
  log:
    level: debug
    console: true

server:
  http:
    network: tcp
    addr: 0.0.0.0:8000
    timeout: 10s
  grpc:
    network: tcp
    addr: 0.0.0.0:9000
    timeout: 10s
    enable_reflection: true

# 示例默认不连接外部存储，便于直接启动。
# 需要存储时，字段直接使用 api/config/v1/data.proto 定义。
data: {}
